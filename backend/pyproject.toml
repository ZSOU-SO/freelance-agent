[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "freelance-agent"
version = "0.1.0"
description = "Freelance requirement analysis with OpenAI Agents SDK and local fallback"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "openai-agents>=0.14,<0.15",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["data*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
